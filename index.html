<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14171F">
<title>VideoShelf</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <div>
      <h1>VideoShelf</h1>
      <p>Your saved videos, shelved and searchable</p>
    </div>
  </div>
  <button id="themeBtn" class="icon-btn" type="button" aria-label="Toggle light mode">☀</button>
</header>

<nav class="tabs">
  <button class="tab-btn active" type="button" data-tab="shelfTab">Shelf</button>
  <button class="tab-btn" type="button" data-tab="dashboardTab">Dashboard</button>
</nav>

<main class="container">

<!-- ============ SHELF TAB ============ -->
<section id="shelfTab" class="tab-panel">

  <section class="card add-panel">
    <h2>Add a video</h2>
    <form id="videoForm" novalidate>
      <label>
        YouTube link
        <input id="urlInput" type="url" placeholder="https://youtube.com/watch?v=..." inputmode="url" required>
      </label>
      <label>
        Custom name
        <input id="nameInput" type="text" maxlength="120" placeholder="e.g. PHP Lecture 1 — Arrays" required>
      </label>
      <div class="field-row two-col">
        <label>
          Category
          <input id="categoryInput" type="text" maxlength="40" placeholder="e.g. PHP" list="categoryList">
          <datalist id="categoryList"></datalist>
        </label>
        <label>
          Sub-category <span class="optional">optional</span>
          <input id="subCategoryInput" type="text" maxlength="40" placeholder="e.g. Arrays" list="subCategoryList">
          <datalist id="subCategoryList"></datalist>
        </label>
      </div>
      <label>
        Notes <span class="optional">optional</span>
        <textarea id="notesInput" maxlength="500" placeholder="Anything worth remembering about this one..."></textarea>
      </label>
      <div class="form-footer">
        <p id="formMsg" class="msg" aria-live="polite"></p>
        <button class="btn-primary" type="submit">Add to shelf</button>
      </div>
    </form>
  </section>

  <section class="toolbar">
    <input id="searchInput" type="search" placeholder="Search name, category, notes...">
    <div class="toolbar-row">
      <select id="filterSelect" aria-label="Filter">
        <option value="all">All videos</option>
        <option value="favorites">★ Favorites</option>
        <option value="unwatched">○ Not watched</option>
        <option value="watched">◐ Watched</option>
        <option value="completed">✓ Completed</option>
      </select>
      <select id="sortSelect" aria-label="Sort">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="name-asc">Name A–Z</option>
        <option value="name-desc">Name Z–A</option>
        <option value="category">By category</option>
        <option value="manual">Manual order (drag)</option>
      </select>
    </div>
    <div class="toolbar-row">
      <select id="categoryFilter" aria-label="Category">
        <option value="all">All categories</option>
      </select>
      <select id="subCategoryFilter" aria-label="Sub-category" hidden>
        <option value="all">All sub-categories</option>
      </select>
      <div class="view-toggle" role="group" aria-label="View">
        <button type="button" class="view-btn active" data-view="cards" aria-label="Card view">⬛</button>
        <button type="button" class="view-btn" data-view="compact" aria-label="Compact view">☰</button>
      </div>
    </div>
    <div class="toolbar-row">
      <button id="selectModeBtn" class="btn-ghost" type="button">Select</button>
      <button id="manageCategoriesBtn" class="btn-ghost" type="button">Category colors</button>
    </div>
  </section>

  <section class="stats" id="stats"></section>

  <div id="bulkBar" class="bulk-bar" hidden>
    <span id="bulkCount"></span>
    <div class="bulk-actions">
      <button id="bulkMoveBtn" class="btn-ghost" type="button">Move to...</button>
      <button id="bulkDeleteBtn" class="btn-danger" type="button">Delete</button>
    </div>
  </div>

  <section id="videoList" class="video-list view-cards"></section>

  <section class="io-panel">
    <button id="exportBtn" class="btn-ghost" type="button">Export backup</button>
    <label class="btn-ghost file-label">
      Import backup
      <input id="importInput" type="file" accept="application/json" hidden>
    </label>
  </section>
  <section class="io-panel">
    <label class="import-mode-label">
      Import mode
      <select id="importModeSelect">
        <option value="merge">Merge (add new, skip duplicates)</option>
        <option value="replace">Replace everything</option>
      </select>
    </label>
  </section>

</section>

<!-- ============ DASHBOARD TAB ============ -->
<section id="dashboardTab" class="tab-panel" hidden>

  <section class="card">
    <h2>Overall progress</h2>
    <div id="dashOverall" class="dash-stat-row"></div>
  </section>

  <section class="card">
    <div class="dash-cal-header">
      <button id="calPrevBtn" class="icon-btn small" type="button" aria-label="Previous month">‹</button>
      <span id="calendarLabel"></span>
      <button id="calNextBtn" class="icon-btn small" type="button" aria-label="Next month">›</button>
    </div>
    <div id="calendarGrid" class="calendar-grid"></div>
    <div class="cal-legend">
      <span><i class="dot-added"></i> Added</span>
      <span><i class="dot-activity"></i> Watched/Completed</span>
    </div>
  </section>

  <section class="card">
    <div class="dash-day-header">
      <h2 id="dashboardDateLabel">Today</h2>
      <button id="dashTodayBtn" class="btn-ghost" type="button">Jump to today</button>
    </div>
    <div id="dashDayStats" class="dash-stat-row"></div>
    <div id="dashDayList" class="dash-day-list"></div>
  </section>

  <section class="card">
    <h2>By category</h2>
    <div id="dashCategoryBreakdown" class="dash-cat-list"></div>
  </section>

</section>

</main>

<!-- Edit modal -->
<div id="editOverlay" class="overlay" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="editHeading">
    <h2 id="editHeading">Edit video</h2>
    <label>Name<input id="editName" maxlength="120"></label>
    <div class="field-row two-col">
      <label>Category<input id="editCategory" maxlength="40" list="categoryList"></label>
      <label>Sub-category<input id="editSubCategory" maxlength="40" list="subCategoryList"></label>
    </div>
    <label>Status
      <select id="editStatus">
        <option value="unwatched">Not watched</option>
        <option value="watched">Watched</option>
        <option value="completed">Completed</option>
      </select>
    </label>
    <label>Notes<textarea id="editNotes" maxlength="500"></textarea></label>
    <div class="modal-actions">
      <button id="editCancel" class="btn-ghost" type="button">Cancel</button>
      <button id="editSave" class="btn-primary" type="button">Save changes</button>
    </div>
  </div>
</div>

<!-- Confirm modal (single + bulk delete) -->
<div id="confirmOverlay" class="overlay" hidden>
  <div class="modal-card modal-card-sm" role="dialog" aria-modal="true" aria-labelledby="confirmHeading">
    <h2 id="confirmHeading">Remove this video?</h2>
    <p id="confirmBody" class="confirm-body">This can't be undone.</p>
    <div class="modal-actions">
      <button id="confirmCancel" class="btn-ghost" type="button">Cancel</button>
      <button id="confirmOk" class="btn-danger" type="button">Remove</button>
    </div>
  </div>
</div>

<!-- Category color manager -->
<div id="categoryManagerOverlay" class="overlay" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="catManagerHeading">
    <h2 id="catManagerHeading">Category colors</h2>
    <div id="categoryManagerList" class="cat-manager-list"></div>
    <div class="modal-actions">
      <button id="categoryManagerClose" class="btn-primary" type="button">Done</button>
    </div>
  </div>
</div>

<!-- Bulk move modal -->
<div id="bulkMoveOverlay" class="overlay" hidden>
  <div class="modal-card modal-card-sm" role="dialog" aria-modal="true" aria-labelledby="bulkMoveHeading">
    <h2 id="bulkMoveHeading">Move selected videos</h2>
    <label>Category
      <select id="bulkMoveCategorySelect"></select>
    </label>
    <label>Sub-category <span class="optional">optional</span>
      <input id="bulkMoveSubInput" maxlength="40" placeholder="e.g. Arrays">
    </label>
    <div class="modal-actions">
      <button id="bulkMoveCancel" class="btn-ghost" type="button">Cancel</button>
      <button id="bulkMoveConfirm" class="btn-primary" type="button">Move</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
